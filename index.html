<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Siteline: pin a site, read the lines. Grid, power, fiber, and OpenInfraMap. NLT143 RESEARCH by David T Phung." />
    <meta name="theme-color" content="#05070a" />
    <meta name="color-scheme" content="dark" />
    <title>Siteline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; color: #fff; font: 500 13px/1.4 Inter, system-ui, sans-serif; }
      #sl-live-map { position: fixed; inset: 0; }
      #sl-live-bar {
        position: fixed; z-index: 5; left: 12px; top: 12px;
        max-width: min(420px, calc(100vw - 24px));
        padding: 10px 12px; border-radius: 8px;
        background: rgba(5,7,10,0.88); border: 1px solid rgba(255,255,255,0.1);
      }
      #sl-live-bar h1 { margin: 0 0 4px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
      #sl-live-status { margin: 0; color: #cbd5e1; font-size: 12px; }
      #sl-live-legend { margin: 8px 0 0; color: #94a3b8; font-size: 11px; }
      #sl-live-card {
        position: fixed; z-index: 6; right: 12px; top: 12px;
        width: min(280px, calc(100vw - 24px));
        padding: 10px 12px; border-radius: 8px;
        background: rgba(5,7,10,0.92); border: 1px solid rgba(255,255,255,0.12);
      }
      #sl-live-card strong { display: block; margin-bottom: 6px; }
      #sl-live-card p { margin: 0; color: #e2e8f0; }
    </style>
  </head>
  <body>
    <div id="sl-live-map"></div>
    <div id="sl-live-bar">
      <h1>Siteline</h1>
      <p id="sl-live-status">Starting map...</p>
      <p id="sl-live-legend">Blue plants, amber lines and substations, cyan broadband, pink data centers. Pan to load the view.</p>
    </div>
    <div id="sl-live-card" hidden></div>
    <script type="module" src="./assets/siteline-live.js?v=live-map"></script>
  </body>
</html>
